# Publica danielhsk/mindtrack en Docker Hub.
# Secrets del repo (Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME  (ej. danielhsk)
#   DOCKERHUB_TOKEN     (Access Token de hub.docker.com)

name: Publish Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - app/**
      - src/**
      - models/**
      - data/**
      - reports/**
      - assets/**
      - .streamlit/**

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            danielhsk/mindtrack:latest
            danielhsk/mindtrack:1.0.0
            danielhsk/mindtrack:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max